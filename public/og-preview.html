<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/og-preview.css" />
    <title>Study Quest — social preview</title>
  </head>
  <body>
    <div class="og">
      <div class="og__grid">
        <div class="og__copy">
          <div class="og__brand">
            <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
              <rect
                x="1.25"
                y="1.25"
                width="29.5"
                height="29.5"
                rx="7"
                stroke="currentColor"
                stroke-width="1.5"
              />
              <path
                d="M16 6.4l2.5 7.1 7.1 2.5-7.1 2.5L16 25.6l-2.5-7.1L6.4 16l7.1-2.5z"
                fill="currentColor"
              />
            </svg>
            <span class="og__wordmark">Study Quest</span>
            <span class="og__version">v1.3.1</span>
          </div>

          <h1>Study like it&rsquo;s a <em>quest</em>, not a countdown.</h1>

          <p class="og__sub">
            Focus sessions become XP, streaks, and a year of visible progress. A
            small, local-first Windows app.
          </p>

          <div class="og__meta">
            <span class="og__dot"></span>
            No account &nbsp;·&nbsp; No cloud &nbsp;·&nbsp; No telemetry
          </div>

          <div class="og__footer">
            <span>Windows 10 / 11</span>
            <span>Free · MIT</span>
            <span>74.8 MB</span>
          </div>
        </div>

        <div class="og__visual">
          <div class="og__plate">
            <img src="/images/dashboard-overview-1400.webp" alt="" />
          </div>
          <div class="og__overlay">
            <img src="/images/overlay-300.webp" alt="" />
          </div>
          <div class="og__seal">
            <svg viewBox="0 0 160 160" fill="none" aria-hidden="true">
              <defs>
                <path
                  id="og-seal-ring"
                  d="M80 80m-59 0a59 59 0 1 1 118 0a59 59 0 1 1-118 0"
                />
              </defs>
              <circle cx="80" cy="80" r="74" stroke="currentColor" stroke-width="1" />
              <circle
                cx="80"
                cy="80"
                r="48"
                stroke="currentColor"
                stroke-width="1"
                stroke-dasharray="2 4"
              />
              <text
                fill="currentColor"
                font-size="10"
                font-family="IBM Plex Mono, monospace"
                letter-spacing="2.3"
              >
                <textPath href="#og-seal-ring" startOffset="1%">
                  LOCAL-FIRST · NO ACCOUNT · NO CLOUD · STUDY QUEST ·
                </textPath>
              </text>
              <path
                d="M80 64l3.3 9.7 9.7 3.3-9.7 3.3L80 90l-3.3-9.7-9.7-3.3 9.7-3.3z"
                fill="currentColor"
              />
              <text
                x="80"
                y="103"
                text-anchor="middle"
                fill="currentColor"
                font-size="7.5"
                font-family="IBM Plex Mono, monospace"
                letter-spacing="2"
              >
                WINDOWS
              </text>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
